pluginVersion=0.1.1
platformVersion=2026.2.2
pluginSinceBuild=262
pluginUntilBuild=262.*

# Path to a local Rider installation to build against instead of downloading the platform,
# e.g. -PplatformLocalPath=/Applications/Rider.app or set it in ~/.gradle/gradle.properties.
# platformLocalPath=

# The IDE provides the Kotlin stdlib; the plugin must not bundle its own.
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
# Compiling against the full Rider platform runs the default heaps out of memory on non-incremental builds.
org.gradle.jvmargs=-Xmx2g
kotlin.daemon.jvmargs=-Xmx3g
